<style>
/* Layout: white branded header (logo left, title, tabs); each view = week ribbon or filter row, then working tables. Left-aligned. */
:root{
  /* AMHEC brand, matched to the AMHEC QHSE Training Pro app */
  --page:#F8FAFC; --surface:#ffffff; --sunk:#eef2f7; --line:#e2e8f0;
  --ink:#1e293b; --muted:#64748b; --brand:#2E2E9D; --brand2:#4F46E5; --deep:#0a0a3d; --brand-ink:#ffffff; --amber:#f59e0b;
  --good:#059669; --good-bg:#d1fae5; --ok:#2E2E9D; --ok-bg:#e0e7ff; --warn:#b45309; --warn-bg:#fef3c7; --bad:#dc2626; --bad-bg:#fee2e2;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:400 15px/1.5 var(--body);padding-bottom:env(safe-area-inset-bottom,0)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px}
.app{display:flex;min-height:100vh}
.side{width:250px;flex:none;background:linear-gradient(180deg,var(--brand),var(--deep));color:#fff;position:fixed;top:0;bottom:0;left:0;z-index:30;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0);transition:left .25s}
.side .top{display:flex;justify-content:center;padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.logo.big{width:120px;height:132px;padding:8px;border-radius:16px}
.logo{width:46px;height:50px;object-fit:contain;background:#fff;border-radius:10px;padding:3px;flex:none}
.side .brand{font:700 18px/1.1 var(--display);letter-spacing:.05em;color:#fff}
.side nav{display:grid;gap:4px;padding:14px 10px;flex:1;align-content:start}
.side nav a{color:rgba(255,255,255,.78);text-decoration:none;font:600 16px/1 var(--display);letter-spacing:.02em;padding:12px 14px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
.side nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.side nav a.on{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 4px 0 0 var(--amber)}
.side nav a .count{min-width:22px;padding:2px 7px;border-radius:10px;background:var(--amber);color:#1b1404;font:600 12px/1.3 var(--body);text-align:center}
.side .who{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(255,255,255,.1);display:grid;gap:8px;font-size:13px}
.side .who b{font-size:14px}
.side .who .r{color:rgba(255,255,255,.7)}
.side .who .row{gap:6px}
.side .who button{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.side .who button.out{background:rgba(239,68,68,.18);color:#fecaca}
.mainwrap{flex:1;min-width:0;margin-left:250px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px}
.topbar .t{font:700 22px/1.1 var(--display);color:var(--brand);letter-spacing:.03em}
.topbar .av{margin-left:auto;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.burger{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;width:38px;height:38px;font-size:18px;cursor:pointer}
.scrim{display:none}
@media (max-width:900px){
  .side{left:-270px}
  .side.open{left:0;box-shadow:4px 0 30px rgba(0,0,0,.3)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}
  .mainwrap{margin-left:0}
  .burger{display:block}
}
main{padding-block:22px 60px}
h1{font:700 30px/1.1 var(--display);margin:0 0 4px;text-wrap:balance}
h2{font:700 21px/1.2 var(--display);margin:0 0 10px}
.lead{color:var(--muted);margin:0 0 18px;max-width:72ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.stack{display:grid;gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1180px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){table.kt thead tr th:first-child{display:none} table.kt tr{display:grid;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)} table.kt td,table.kt th{border:0;padding:0} table.kt td:first-child{min-width:0}}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-width:0;width:100%}
textarea{min-height:70px;resize:vertical}
input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
input:user-invalid{border-color:var(--bad)}
[hidden]{display:none!important}
.tg{white-space:nowrap}
.btn{border:0;background:linear-gradient(135deg,var(--brand),var(--brand2));color:var(--brand-ink);border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:0 4px 14px rgba(46,46,157,.22)}
.btn.line{background:#fff;color:var(--brand);border:1px solid #c7d2fe;box-shadow:none}
.btn.warn{background:var(--bad);color:#fff;box-shadow:none}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
a.link,button.link{color:var(--brand);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-weight:500}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-weight:600;font-size:13px;color:var(--muted);text-align:left;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.pill{display:inline-block;padding:3px 9px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.s-draft{background:var(--sunk);color:var(--muted)} .s-submitted{background:var(--warn-bg);color:var(--warn)}
.s-approved{background:var(--good-bg);color:var(--good)} .s-returned{background:var(--bad-bg);color:var(--bad)}
.r-ex{background:var(--good-bg);color:var(--good)} .r-gd{background:var(--ok-bg);color:var(--ok)} .r-ni{background:var(--warn-bg);color:var(--warn)} .r-po{background:var(--bad-bg);color:var(--bad)} .r-na{background:var(--sunk);color:var(--muted)}
.meter{display:flex;align-items:center;gap:8px;min-width:120px}
.meter i{flex:1;height:8px;border-radius:4px;background:var(--sunk);position:relative;overflow:hidden}
.meter i b{position:absolute;inset:0 auto 0 0;border-radius:4px}
.meter span{width:44px;text-align:right;font-size:13px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand2);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.tile .k{font-size:13px;color:var(--muted)} .tile .v{font:700 34px/1.05 var(--display);font-variant-numeric:tabular-nums} .tile .s{font-size:13px;color:var(--muted)}
.ribbon{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--amber);border-radius:var(--r);padding:12px 14px;margin-bottom:16px}
.ribbon .wk{font:700 26px/1.05 var(--display)}
.ribbon .days{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.ribbon .days span{font-size:12px;padding:2px 7px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.ribbon .days span.today{background:var(--amber);color:#1b1404;font-weight:600}
.navbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;line-height:1}
.navbtn[disabled]{opacity:.35;cursor:default}
.note{padding:10px 12px;border-radius:6px;background:var(--sunk);font-size:14px}
.note.bad{background:var(--bad-bg);color:var(--bad)} .note.good{background:var(--good-bg);color:var(--good)} .note.warn{background:var(--warn-bg);color:var(--warn)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font:600 18px/1.3 var(--display);margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--page);padding:10px 16px;border-radius:8px;z-index:50;max-width:calc(100% - 32px);font-size:14px}
.loginbg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,var(--brand),var(--deep),var(--brand2))}
.login{width:100%;max-width:420px;display:grid;gap:14px}
.login .panel{padding:28px;display:grid;gap:16px;border:0;box-shadow:0 20px 60px rgba(0,0,0,.35);border-radius:20px}
.login .head{display:flex;gap:14px;align-items:center}
.login .head .logo{width:64px;height:70px}
.muted{color:var(--muted)} .small{font-size:13px}
.kpiname{font-weight:500} .sub{font-size:12.5px;color:var(--muted)}
.code{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(12,14,36,.55);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.modal .panel{width:100%;max-width:960px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font:500 11px var(--body)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border:1px solid var(--line);border-radius:14px;font-size:13px;background:var(--surface);cursor:pointer}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
details.grp{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:12px}
details.grp>summary{cursor:pointer;padding:12px 14px;font:700 18px/1.2 var(--display);display:flex;gap:10px;align-items:center;justify-content:space-between;list-style:none}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"▾";color:var(--muted);font-size:14px}
details.grp:not([open])>summary::after{content:"▸"}
details.grp>.in{padding:0 14px 12px}
.prog{font-size:12.5px;color:var(--muted);white-space:nowrap}
.dg{display:grid;grid-template-columns:repeat(6,80px) 64px;gap:6px;align-items:center}
.dg input{width:100%;padding:7px 6px;text-align:center}
.dg .dc{display:grid;gap:3px}
.dg select.lc{padding:4px 2px;font-size:11.5px;border-radius:5px;color:var(--muted)}
.dg select.lc.set{color:var(--ink);border-color:#c7d2fe;background:#eef2ff}
.dg.ro span small{display:block;font-size:10.5px;color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dg.dh button.dbtn{font:600 12px var(--body);color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:6px;padding:3px 0;cursor:pointer}
.dg.dh button.dbtn:hover{background:var(--brand);color:#fff}
.pt th button.dbtn{font:600 12.5px var(--body);color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:6px;padding:4px 8px;cursor:pointer;white-space:nowrap}
.pt td.pd{min-width:130px;vertical-align:top}
.pt td.pd b{display:block;font-size:13px;color:var(--brand)}
.pt td.pd .sub{white-space:pre-wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--brand);color:#fff}
table.mp td{vertical-align:top}
.pk{display:grid;grid-template-columns:minmax(0,1fr) 150px 34px;gap:6px;align-items:center;margin-bottom:6px}
.pk .tgt{font-size:12.5px;color:var(--brand);font-weight:600}
.pk .x{height:34px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-size:18px;color:var(--muted)}
.pk .x[disabled]{opacity:.35;cursor:default}
.dg input.td{border-color:var(--amber);box-shadow:0 0 0 2px rgba(245,158,11,.18)}
.dg.dh span{font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.dg.dh span.td{color:#92400e;background:#fef3c7;border-radius:6px;padding:2px 0}
.dg .tot{text-align:right;font-variant-numeric:tabular-nums}
.dg.ro span{text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
table.kt td:first-child{min-width:240px}
.prog b{color:var(--ink)}
@media (max-width:640px){.dg{grid-template-columns:repeat(6,minmax(0,1fr)) 38px;gap:3px} .dg input{width:100%;padding:7px 1px} .dg select.lc{font-size:10px;padding:3px 0} .dg.dh span{font-size:11px} details.grp>.in{padding:0 10px 10px}}
@media (max-width:640px){table.mp thead{display:none} table.mp tr{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)} table.mp td{border:0;padding:0} table.mp td:first-child{display:flex;gap:8px;align-items:baseline} .pk{grid-template-columns:minmax(0,1fr) 34px} .pk .tgt{grid-column:1;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

// ---------- dates: week = Saturday to Thursday; a week belongs to the month of its Thursday ----------
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const addD = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const satOf = d => addD(new Date(d.getFullYear(),d.getMonth(),d.getDate()), -((d.getDay()+1)%7));
const thisWeek = () => ymd(satOf(new Date()));
const thuOf = k => addD(parse(k),5);
const wkLabel = k => { const s=parse(k), e=addD(s,5); return `${s.getDate()} ${MON[s.getMonth()]} – ${e.getDate()} ${MON[e.getMonth()]} ${e.getFullYear()}`; };
const shortD = k => { const d=parse(k); return `${d.getDate()} ${MON[d.getMonth()]}`; };
function weeksIn(from,to){ // Saturdays whose Thursday falls in [from,to], up to today
  const end = to > new Date() ? new Date() : to; let s=satOf(addD(from,5)); if(addD(s,5)<from) s=addD(s,7);
  let n=0; while(addD(s,5)<=end){ n++; s=addD(s,7);} return n; }
const wkRange = (from,to) => [ymd(addD(from,-5)), ymd(addD(to,-5))]; // week_start bounds for weeks whose Thursday is in range
function periodWindow(period, d){ // calendar window of a KPI period containing date d
  const y=d.getFullYear(), m=d.getMonth();
  if(period==='day'||period==='week') return null;
  if(period==='month'||period==='event') return [new Date(y,m,1), new Date(y,m+1,0), MON[m]];
  if(period==='bimonth'){ const s=m-m%2; return [new Date(y,s,1), new Date(y,s+2,0), MON[s]+'–'+MON[s+1]]; }
  if(period==='quarter'){ const s=m-m%3; return [new Date(y,s,1), new Date(y,s+3,0), 'Q'+(s/3+1)]; }
  if(period==='half'){ const s=m<6?0:6; return [new Date(y,s,1), new Date(y,s+6,0), s?'H2':'H1']; }
  return [new Date(y,0,1), new Date(y,11,31), String(y)];
}
const weeklyTarget = (t,period,measure) => measure==='percent' ? 100 : (t==null||t==='' ? null :
  Math.round(Number(t)*({day:6,week:1,month:12/52,event:12/52,bimonth:6/52,quarter:4/52,half:2/52,year:1/52}[period]??1)*10000)/10000);

// ---------- scoring ----------
function ach(dir,t,a,measure){ if(t==null) return null; a=Number(a)||0; t=Number(t)||0;
  if(measure==='percent') return Math.min(1,Math.max(0,a/100));
  if(dir==='lower'){ if(t===0) return Math.max(0,1-0.25*a); return a<=t?1:t/a; }
  return t===0?1:Math.min(1.2,a/t); }
function rating(s){ if(s==null||isNaN(s)) return ['No data','r-na']; if(s>=.9) return ['Excellent','r-ex']; if(s>=.75) return ['Good','r-gd']; if(s>=.6) return ['Needs improvement','r-ni']; return ['Poor','r-po']; }
const col = s => s==null?'var(--line)': s>=.9?'var(--good)': s>=.75?'var(--ok)': s>=.6?'var(--warn)':'var(--bad)';
const pct = s => s==null||isNaN(s) ? '–' : Math.round(s*100)+'%';
const meter = s => `<div class="meter"><i><b style="width:${Math.min(100,(s||0)/1.2*100)}%;background:${col(s)}"></b></i><span>${pct(s)}</span></div>`;
const rpill = s => { const [t,c]=rating(s); return `<span class="pill ${c}">${t}</span>`; };
const spill = st => `<span class="pill s-${esc(st)}">${({draft:'Not submitted',submitted:'Waiting approval',approved:'Approved',returned:'Returned'})[st]||esc(st)}</span>`;
const DAYN=['Sat','Sun','Mon','Tue','Wed','Thu'];
const refOf = (r,i) => Array.isArray(r.daily_ref) ? (r.daily_ref[i]||'') : '';
const locList = () => (S.lists||{}).sites || [];
const locOpts = (list,cur,blank='Location') => `<option value="">${blank}</option>`+[...new Set([...(cur&&!list.includes(cur)?[cur]:[]),...list])].map(x=>`<option ${x===cur?'selected':''}>${esc(x)}</option>`).join('');
const dayVal = (r,i) => Array.isArray(r.daily)&&r.daily[i]!==''&&r.daily[i]!=null ? r.daily[i] : null;
const dayRO = r => `<div class="dg ro">${DAYN.map((d,i)=>{ const ref=refOf(r,i); return `<span title="${d}${ref?': '+esc(ref):''}">${dayVal(r,i)!=null?num(r.daily[i]):'·'}${ref?`<small>${esc(ref)}</small>`:''}</span>`; }).join('')}<b class="tot">${r.actual==null?'–':num(r.actual)+(r.measure==='percent'?'%':'')}</b></div>`;
const dayHeadRO = week => `<div class="dg dh">${DAYN.map((d,i)=>`<span>${d} ${addD(parse(week),i).getDate()}</span>`).join('')}<span class="tot">Week</span></div>`;
const dayHeadBtn = week => `<div class="dg dh">${DAYN.map((d,i)=>`<button type="button" class="dbtn" data-day="${i}" title="Open ${d} ${shortD(ymd(addD(parse(week),i)))}">${d} ${addD(parse(week),i).getDate()}</button>`).join('')}<span class="tot">Week</span></div>`;
const tgtText = r => r.measure==='percent' ? '100%' : (r.period_target==null ? 'Record only' : `${num(r.period_target)} ${PERIODS[r.period]||''}`);

async function fetchAll(make){ let out=[], from=0; for(;;){ const {data,error}=await make().range(from,from+999); if(error) throw error; out=out.concat(data); if(data.length<1000) break; from+=1000; } return out; }

async function startApp(session){
  const email = session.user.email.toLowerCase();
  const {data:me,error} = await sb.from('profiles').select('*').eq('email',email).maybeSingle();
  if(error){ err(error); return; }
  if(!me || !me.active){ $('#root').innerHTML=`<div class="loginbg"><div class="login"><div class="panel"><h1>Not registered</h1><p>${esc(email)} is not in the portal yet. Ask the QHSE department to add you.</p><button class="btn line" id="so">Sign out</button></div></div></div>`; $('#so').onclick=()=>sb.auth.signOut(); return; }
  S.me=me; S.week=thisWeek();
  const {data:ll} = await sb.from('lookup_lists').select('name,items'); S.lists=Object.fromEntries((ll||[]).map(l=>[l.name,l.items||[]]));
  const {data:team} = await sb.from('profiles').select('*').eq('active',true).order('full_name');
  S.team = (team||[]).filter(p=>p.id!==me.id);
  shell(); route();
}

// ---------- shared: week ribbon (Sat–Thu) ----------
function ribbon(week, id, ahead=0){
  const s=parse(week), today=ymd(new Date());
  const days=['Sat','Sun','Mon','Tue','Wed','Thu'].map((d,i)=>{const k=ymd(addD(s,i)); return `<span class="${k===today?'today':''}">${d} ${addD(s,i).getDate()}</span>`;}).join('');
  return `<div class="ribbon"><button class="navbtn" id="${id}Prev" aria-label="Previous week">‹</button>
    <div><div class="wk">Week of ${esc(wkLabel(week))}</div><div class="days">${days}</div></div>
    <button class="navbtn" id="${id}Next" aria-label="Next week" ${week>=ymd(addD(parse(thisWeek()),7*ahead))?'disabled':''}>›</button></div>`;
}
function bindRibbon(id, getW, setW, after){
  $(`#${id}Prev`).onclick=()=>{ setW(ymd(addD(parse(getW()),-7))); after(); };
  $(`#${id}Next`).onclick=()=>{ setW(ymd(addD(parse(getW()),7))); after(); };
}

const D = { type:'month', year:new Date().getFullYear(), month:new Date().getMonth(), quarter:Math.floor(new Date().getMonth()/3), week:thisWeek(), group:'', q:'' };
function period(){
  const y=D.year;
  if(D.type==='week') return [parse(D.week), thuOf(D.week), 'Week of '+wkLabel(D.week), 1];
  if(D.type==='month') return [new Date(y,D.month,1), new Date(y,D.month+1,0), MON[D.month]+' '+y, 2];
  if(D.type==='quarter') return [new Date(y,D.quarter*3,1), new Date(y,D.quarter*3+3,0), `Q${D.quarter+1} ${y}`, 3];
  return [new Date(y,0,1), new Date(y,11,31), 'Year '+y, 5];
}

function bars(vals, labels){
  const W=560,H=200,L=34,B=24,T=10,iw=W-L-8,ih=H-T-B,max=1.2,bw=iw/labels.length;
  const y=v=>T+ih-(v/max)*ih; let g='';
  [0,.3,.6,.9,1.2].forEach(v=>{g+=`<line x1="${L}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v===.9?'stroke-dasharray="4 4"':''}/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${Math.round(v*100)}</text>`;});
  vals.forEach((v,i)=>{ const x=L+i*bw+bw*.18, w=bw*.64;
    if(v!=null) g+=`<rect x="${x}" y="${y(Math.min(v,max))}" width="${w}" height="${y(0)-y(Math.min(v,max))}" rx="2" fill="${col(v)}"><title>${labels[i]}: ${pct(v)}</title></rect>`;
    g+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${esc(labels[i])}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Score chart">${g}</svg><p class="small muted" style="margin:4px 0 0">Dashed line: 90% (Excellent). Scores in %.</p>`;
}

        <span class="small muted">${last?'Last saved '+new Date(last).toLocaleString():'Not saved yet for this week.'}</span></div></form>`;
      b.querySelectorAll('[data-l]').forEach(s=>s.onchange=()=>{ st[+s.dataset.l].location=s.value; });
      b.querySelectorAll('[data-k]').forEach(s=>s.onchange=()=>{ st[+s.dataset.k].items[+s.dataset.j]=s.value; draw(); });
      b.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>{ st[+x.dataset.add].items.push(''); draw(); });
      b.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{ const s=st[+x.dataset.rm]; s.items.splice(+x.dataset.j,1); if(!s.items.length) s.items=['']; draw(); });
      $('#mpCopy')&&($('#mpCopy').onclick=()=>{ (prev||[]).forEach(x=>{ const t=toState(x); if(!t.items.length) t.items=['']; st[x.day]=t; }); draw(); toast('Copied. Change what you need, then Save plan.'); });
      $('#mpF').onsubmit=async e=>{ e.preventDefault(); const bt=e.submitter; bt.disabled=true;
        const rows=st.map((s,i)=>{ const items=[...new Set(s.items.filter(Boolean))].map(id=>{ const k=kById[id]; return {kpi_id:id, code:k.kpi_code, name:k.kpi_name, target:tgtText(k)}; });
          return {officer_id:S.me.id, week_start:PL.week, day:i, location:s.location||null, items,
            activity:items.length?items.map(x=>`${x.code} – ${x.name} (${x.target})`).join('\n'):(s.note||null), updated_at:new Date().toISOString()}; });
        const {error}=await sb.from('week_plans').upsert(rows,{onConflict:'officer_id,week_start,day'});
        bt.disabled=false; if(error) return err(error); toast('Plan saved.'); viewMyPlan(); };
    };
    draw();
  }catch(x){ err(x); $('#mpBody').innerHTML='<b>Could not load your plan</b>Check your connection and refresh the page.'; }
}

    <div class="panel row" style="margin-bottom:16px"><label class="f" for="tpQ" style="min-width:220px;flex:1">Search CAM No. or name<input type="search" id="tpQ" placeholder="e.g. 1234 or Ahmed" value="${esc(TP.q)}"></label>

  bindRibbon('tp',()=>TP.week,w=>TP.week=w,viewPlans);

      ${missing.length?`<div class="note warn"><b>Not filled yet:</b> ${missing.map(p=>esc(p.full_name)).join(', ')}</div>`:''}
      <div class="panel"><div class="scroll"><table class="pt"><thead><tr><th>Officer</th>${DAYN.map((d,i)=>`<th><button type="button" class="dbtn" data-day="${i}">${d} ${parse(days[i]).getDate()} ${MON[parse(days[i]).getMonth()]}</button></th>`).join('')}</tr></thead><tbody>
      ${ppl.map(p=>`<tr data-s="${esc(((p.employee_no||'')+' '+(p.full_name||'')).toLowerCase())}"><td><div class="kpiname">${esc(p.full_name)}</div><div class="sub">${p.employee_no?'CAM '+esc(p.employee_no)+' · ':''}${esc(p.designation||'')}</div></td>
        ${DAYN.map((d,i)=>{ const x=(map[p.id]||{})[i]; return `<td class="pd">${x&&(x.location||x.activity)?`${x.location?`<b>${esc(x.location)}</b>`:''}<div class="sub">${esc(x.activity||'')}</div>`:'<span class="muted">–</span>'}</td>`; }).join('')}</tr>`).join('')}
      </tbody></table></div><p class="small muted" id="tpNo" hidden>No one matches your search.</p></div>`;
    b.querySelectorAll('.dbtn').forEach(bt=>bt.onclick=()=>openDay(TP.week,+bt.dataset.day,null,'team'));
    const filt=()=>{ const q=TP.q.trim().toLowerCase(); let n=0; b.querySelectorAll('tr[data-s]').forEach(tr=>{ const ok=!q||tr.dataset.s.includes(q); tr.hidden=!ok; if(ok) n++; }); $('#tpNo').hidden=n>0; };
    $('#tpQ').oninput=e=>{ TP.q=e.target.value; filt(); }; filt();
    $('#tpX').onclick=()=>{
      const q=TP.q.trim().toLowerCase(); const sel=ppl.filter(p=>!q||((p.employee_no||'')+' '+(p.full_name||'')).toLowerCase().includes(q));
      const mgr=e=>{ const x=[S.me,...S.team].find(p=>p.email===e); return x?x.full_name:(e||''); };
      const grid=sel.map(p=>({'CAM No':p.employee_no||'', Name:p.full_name, Designation:p.designation||'', Function:p.function||'', Manager:mgr(p.supervisor_email),
        ...Object.fromEntries(DAYN.map((d,i)=>{ const x=(map[p.id]||{})[i]; return [`${d} ${shortD(days[i])}`, x?[x.location,x.activity].filter(Boolean).join(' – '):'']; }))}));
      const list=[]; sel.forEach(p=>DAYN.forEach((d,i)=>{ const x=(map[p.id]||{})[i]; list.push({'CAM No':p.employee_no||'', Name:p.full_name, Designation:p.designation||'', Date:days[i], Day:d, 'Location / client':x?.location||'', Activity:x?.activity||''}); }));

// ---------- Day view (one officer or whole team) ----------
async function openDay(week, i, officerId, mode){
  const ppl=planPeople(); const byId=Object.fromEntries(ppl.map(p=>[p.id,p]));
  const md=document.createElement('div'); md.className='modal'; document.body.appendChild(md);
  const close=()=>md.remove(); md.addEventListener('click',e=>{if(e.target===md) close();});
  const render=async()=>{
    const date=ymd(addD(parse(week),i)), label=`${DAYN[i]} ${shortD(date)} ${parse(date).getFullYear()}`;
    md.innerHTML=`<div class="panel stack" role="dialog" aria-modal="true" aria-label="Day view">
      <div class="row" style="justify-content:space-between"><div><h2 style="margin:0">${esc(label)}</h2><div class="muted">${mode==='one'?esc(byId[officerId]?.full_name||''):'Whole team'} · Week of ${esc(wkLabel(week))}</div></div>
      <div class="row"><div class="seg" role="group" aria-label="Show">${officerId?`<button type="button" data-m="one" class="${mode==='one'?'on':''}">One officer</button>`:''}<button type="button" data-m="team" class="${mode==='team'?'on':''}">Whole team</button></div>
      <button class="btn line sm" data-nav="-1" ${i===0?'disabled':''} aria-label="Previous day">‹</button><button class="btn line sm" data-nav="1" ${i===5?'disabled':''} aria-label="Next day">›</button><button class="btn line sm" id="dyClose">Close</button></div></div>
      <div id="dyBody" class="empty">Loading…</div></div>`;
    md.querySelector('#dyClose').onclick=close;
    md.querySelectorAll('[data-m]').forEach(bt=>bt.onclick=()=>{ mode=bt.dataset.m; render(); });
    md.querySelectorAll('[data-nav]').forEach(bt=>bt.onclick=()=>{ i+=Number(bt.dataset.nav); render(); });
    const body=md.querySelector('#dyBody');
    try{
      if(mode==='one'){
        const [{data:rows,error},{data:pl,error:e2}]=await Promise.all([
          sb.from('week_kpis').select('*').eq('officer_id',officerId).eq('week_start',week).order('kpi_code'),
          sb.from('week_plans').select('*').eq('officer_id',officerId).eq('week_start',week).eq('day',i).maybeSingle()]);
        if(error||e2) throw (error||e2);
        const done=rows.filter(r=>(dayVal(r,i)!=null&&Number(r.daily[i])!==0)||refOf(r,i));
        const locs=[...new Set(rows.map(r=>refOf(r,i)).filter(Boolean))];
        body.className='stack';
        body.innerHTML=`<div class="note"><b>Plan:</b> ${pl&&(pl.location||pl.activity)?`${pl.location?'<b>'+esc(pl.location)+'</b>':''}${pl.location&&pl.activity?' – ':''}${esc(pl.activity||'')}`:'No plan entered for this day.'}</div>
          ${locs.length?`<div class="chips"><span class="small muted">Locations reported:</span>${locs.map(l=>`<span class="chip">${esc(l)}</span>`).join('')}</div>`:''}
          ${done.length?`<div class="scroll"><table><thead><tr><th>KPI</th><th class="n">Done</th><th>Reference / location</th></tr></thead><tbody>
            ${done.map(r=>`<tr><td><div class="code">${esc(r.kpi_code||'')}</div>${esc(r.kpi_name)}</td><td class="n"><b>${dayVal(r,i)!=null?num(r.daily[i])+(r.measure==='percent'?'%':''):'–'}</b></td><td>${esc(refOf(r,i)||'–')}</td></tr>`).join('')}
            </tbody></table></div>`:'<div class="empty"><b>Nothing entered for this day</b>The officer has not filled any KPI for this day yet.</div>'}
          <p class="small muted" style="margin:0">${rows.length-done.length} of ${rows.length} KPIs have nothing entered for this day.</p>`;
      } else {
        const ids=ppl.map(p=>p.id);
        const [kp,pl]=await Promise.all([
          fetchAll(()=>sb.from('week_kpis').select('officer_id,kpi_code,kpi_name,measure,daily,daily_ref').eq('week_start',week).in('officer_id',ids)),
          fetchAll(()=>sb.from('week_plans').select('*').eq('week_start',week).eq('day',i))]);
        const plan=Object.fromEntries(pl.map(x=>[x.officer_id,x]));
        const rows=ppl.map(p=>{ const k=kp.filter(r=>r.officer_id===p.id); const d=k.filter(r=>dayVal(r,i)!=null&&Number(r.daily[i])!==0);
          return {p, plan:plan[p.id], n:d.length, tot:d.filter(r=>r.measure!=='percent').reduce((a,r)=>a+Number(r.daily[i]),0), locs:[...new Set(k.map(r=>refOf(r,i)).filter(Boolean))], kpis:k.length}; });
        body.className='stack';
        body.innerHTML=`<div class="scroll"><table><thead><tr><th>Officer</th><th>Plan for the day</th><th>Locations reported</th><th class="n">KPIs done</th><th></th></tr></thead><tbody>
          ${rows.map(r=>`<tr><td><div class="kpiname">${esc(r.p.full_name)}</div><div class="sub">${r.p.employee_no?'CAM '+esc(r.p.employee_no)+' · ':''}${esc(r.p.designation||'')}</div></td>
            <td>${r.plan&&(r.plan.location||r.plan.activity)?`${r.plan.location?'<b>'+esc(r.plan.location)+'</b>':''}<div class="sub">${esc(r.plan.activity||'')}</div>`:'<span class="muted">No plan</span>'}</td>
            <td>${r.locs.length?esc(r.locs.join(', ')):'<span class="muted">–</span>'}</td>
            <td class="n">${r.kpis?`<b>${r.n}</b> of ${r.kpis}${r.tot?`<div class="sub">${num(r.tot)} entries</div>`:''}`:'<span class="muted">No KPIs yet</span>'}</td>
            <td><button class="btn line sm" data-o="${r.p.id}">Open</button></td></tr>`).join('')}
          </tbody></table></div>
          <div class="row"><button class="btn line sm" id="dyX" type="button">Download this day</button></div>`;
        body.querySelectorAll('[data-o]').forEach(bt=>bt.onclick=()=>{ officerId=bt.dataset.o; mode='one'; render(); });
        body.querySelector('#dyX').onclick=()=>{ const wb=XLSX.utils.book_new();
          const ws=XLSX.utils.json_to_sheet(rows.map(r=>({'CAM No':r.p.employee_no||'', Name:r.p.full_name, Designation:r.p.designation||'', Date:date, Day:DAYN[i],
            'Planned location':r.plan?.location||'', 'Planned activity':r.plan?.activity||'', 'Locations reported':r.locs.join(', '), 'KPIs done':r.n, 'KPIs this week':r.kpis})));
          ws['!cols']=[8,24,22,11,6,18,40,26,10,12].map(w=>({wch:w})); XLSX.utils.book_append_sheet(wb,ws,'Day'); XLSX.writeFile(wb,`AMHEC_QHSE_Day_${date}.xlsx`); };
      }
    }catch(x){ err(x); body.innerHTML='<b>Could not load this day</b>Check your connection and try again.'; }
  };
  render();
}

      const bad=lines.filter(c=>(c[2]||'').trim() && !/^\d{4}$/.test(c[2].trim()));
      if(bad.length) return toast(`${bad.length} rows have a CAM No. that is not 4 digits, for example ${bad[0][0]}. Fix them and paste again.`);
      const recs=lines.map(c=>({full_name:c[0].trim(),email:(c[1]||'').trim().toLowerCase(),employee_no:c[2]?.trim()||null,function:c[3]?.trim()||null,designation:c[4]?desigOf(c[4]):null,supervisor_email:c[5]?.trim().toLowerCase()||null,role:({officer:'officer',manager:'supervisor',supervisor:'supervisor',admin:'admin'})[(c[6]||'').trim().toLowerCase()]||'officer'}));
      const {error}=await sb.from('profiles').upsert(recs,{onConflict:'email'}); if(error) return err(error);
      let pw=0, badpw=0; for(const c of lines){ const p=(c[7]||'').trim(); if(p){ const {error:e2}=await sb.rpc('admin_set_password',{p_email:c[1].trim().toLowerCase(),p_password:p}); e2?badpw++:pw++; } }
      toast(`${recs.length} people saved${pw?`, ${pw} passwords set`:''}${badpw?`, ${badpw} passwords too short`:''}.`); viewSetup(); };
  };
  render();
}
async function setupKpis(){
  const {data:lib,error}=await sb.from('kpi_library').select('*').eq('active',true).order('code'); if(error) throw error;
  const cats=[...new Set(lib.map(k=>k.category).filter(Boolean))].sort();
  const b=$('#sBody'); b.className='stack';
  let filter='';
  const render=(k)=>{ b.innerHTML=`<form id="kF" class="panel stack"><h2 style="margin:0">${k?.id?'Edit KPI '+esc(k.code||''):'Add a KPI'}</h2><div class="grid3">
      <label class="f" for="k_c">KPI ID<input id="k_c" type="text" required value="${esc(k?.code)}"></label>
      <label class="f" for="k_n" style="grid-column:span 2">Activity / KPI<input id="k_n" type="text" required value="${esc(k?.name)}"></label>
      <label class="f" for="k_fn">Function<select id="k_fn">${opts(FUNCTIONS,k?.function_area,'Choose function')}</select></label>
      <label class="f" for="k_cat">Category<input id="k_cat" type="text" list="cats" value="${esc(k?.category)}"></label>
      <label class="f" for="k_fq">Frequency (as written)<input id="k_fq" type="text" value="${esc(k?.frequency)}" placeholder="e.g. Monthly"></label>
      <label class="f" for="k_p">Target period<select id="k_p">${Object.entries(PERIODS).map(([v,t])=>`<option value="${v}" ${(k?.period||'week')===v?'selected':''}>${t}</option>`).join('')}</select></label>
      <label class="f" for="k_m">Measured as<select id="k_m"><option value="count" ${k?.measure!=='percent'?'selected':''}>Count</option><option value="percent" ${k?.measure==='percent'?'selected':''}>Percentage (target 100%)</option></select></label>
      <label class="f" for="k_d">Direction<select id="k_d"><option value="higher" ${k?.direction!=='lower'?'selected':''}>Higher is better</option><option value="lower" ${k?.direction==='lower'?'selected':''}>Lower is better</option></select></label>
    </div><datalist id="cats">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
    <div class="row"><button class="btn" type="submit">${k?.id?'Save KPI':'Add KPI'}</button>${k?.id?'<button class="btn line" type="button" id="kC">Cancel</button><button class="btn line" type="button" id="kOff">Remove from list</button>':''}</div>
    <p class="small muted" style="margin:0">Targets are set per designation in KPI assignment. Changes apply to weeks created after saving.</p></form>
    <div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">${lib.length} KPIs</h2><label class="f" for="kq" style="width:280px">Search<input id="kq" type="search" value="${esc(filter)}" placeholder="ID, name or category"></label></div>
    <div class="scroll"><table><thead><tr><th>KPI</th><th>Category</th><th>Function</th><th>Frequency</th><th></th></tr></thead><tbody id="kRows"></tbody></table></div></div>`;
    const rowsHtml=()=>{ const q=filter.toLowerCase(); $('#kRows').innerHTML=lib.filter(x=>!q||[x.code,x.name,x.category,x.function_area].join(' ').toLowerCase().includes(q)).map(x=>`<tr><td><div class="code">${esc(x.code||'')}</div>${esc(x.name)}</td><td class="small">${esc(x.category||'')}</td><td class="small">${esc(x.function_area||'')}</td><td class="small">${esc(x.frequency||'')}${x.measure==='percent'?' · %':''}</td><td><button class="btn line sm" data-e="${x.id}">Edit</button></td></tr>`).join('');
      b.querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>{render(lib.find(l=>l.id===x.dataset.e)); window.scrollTo(0,0);}); };
    rowsHtml(); $('#kq').oninput=e=>{filter=e.target.value; rowsHtml();};
    $('#kC')&&($('#kC').onclick=()=>render());
    $('#kOff')&&($('#kOff').onclick=async()=>{ if(!confirmInline($('#kOff'),'Click again to remove')) return;
      const {error}=await sb.from('kpi_library').update({active:false}).eq('id',k.id); if(error) return err(error);
      await sb.from('assignment_rules').update({active:false,effective_to:ymd(addD(parse(thisWeek()),-1))}).eq('kpi_id',k.id).eq('active',true);
      toast('KPI removed. It no longer appears in new weeks.'); viewSetup(); });
    $('#kF').onsubmit=async e=>{ e.preventDefault(); const v={code:$('#k_c').value.trim(),name:$('#k_n').value.trim(),function_area:$('#k_fn').value||null,category:$('#k_cat').value.trim()||null,frequency:$('#k_fq').value.trim()||null,period:$('#k_p').value,measure:$('#k_m').value,direction:$('#k_d').value};
      const {error}=await (k?.id?sb.from('kpi_library').update(v).eq('id',k.id):sb.from('kpi_library').insert(v)); if(error) return err(error); toast(k?.id?'KPI saved.':'KPI added. Assign it to a designation next.'); viewSetup(); };
  };
  render();
}
async function setupRules(){
  const [{data:lib,error},{data:people}]=await Promise.all([
    sb.from('kpi_library').select('*').eq('active',true).order('code'),
    sb.from('profiles').select('id,full_name,function,designation,category').eq('active',true).order('full_name')]);
  if(error) throw error;
  const typeName={designation:'Designation',function:'Function',officer:'Individual officer'};
  const vals=t=> t==='officer'? people.map(p=>[p.id,p.full_name]) : t==='function' ? FUNCTIONS.map(v=>[v,v]) : DESIGNATIONS.map(v=>[v,v]);
  const b=$('#sBody'); b.className='stack';
  let type='designation', who=DESIGNATIONS[0], fn='', filter='', kfn='', onlyOn=true;
  const draw=async()=>{
    let qq=sb.from('assignment_rules').select('*').eq('scope_type',type).eq('scope_value',who).eq('active',true).is('effective_to',null);
    qq = (type==='designation' && fn) ? qq.eq('scope_function',fn) : qq.is('scope_function',null);
    const {data:cur,error:e1}=await qq; if(e1) return err(e1);
    const curBy=Object.fromEntries(cur.map(r=>[r.kpi_id,r]));
    onlyOn = cur.length>0;
    let stdNote='';
    if(type==='designation' && fn && !cur.length){ const {count}=await sb.from('assignment_rules').select('id',{count:'exact',head:true}).eq('scope_type','designation').eq('scope_value',who).eq('active',true).is('effective_to',null).is('scope_function',null);
      stdNote = count ? `${esc(who)} in ${esc(fn)} has no separate KPI set, so they get the standard set (${count} KPIs). Choose "All functions (standard)" to see it, or tick KPIs below to create a separate set for ${esc(fn)}.` : ''; }
    if(type==='function' && !kfn) kfn=who;
    b.innerHTML=`<div class="note">Each week, an officer gets the KPIs assigned to their <b>designation</b>, or to their designation and function where a function-specific set exists. An individual assignment overrides the designation for that officer. Targets are per KPI period, for example 5 per month.</div>
    <form id="rF" class="panel stack">
      <div class="grid3">
        <label class="f" for="r_t">Assign by<select id="r_t">${Object.entries(typeName).map(([k,t])=>`<option value="${k}" ${type===k?'selected':''}>${t}</option>`).join('')}</select></label>
        <label class="f" for="r_v">Who<select id="r_v">${vals(type).map(([v,t])=>`<option value="${esc(v)}" ${v===who?'selected':''}>${esc(t)}</option>`).join('')}</select></label>
        ${type==='designation'?`<label class="f" for="r_fn">For function<select id="r_fn"><option value="">All functions (standard)</option>${FUNCTIONS.map(f=>`<option ${f===fn?'selected':''}>${esc(f)}</option>`).join('')}</select></label>`:''}
        <label class="f" for="r_f">Changes apply from week of<input id="r_f" type="date" value="${thisWeek()}"></label>
      </div>
      ${type==='designation'?'<p class="small muted" style="margin:0">If a designation has KPIs set for a specific function (for example Officer HSE in Rig Move HSE Operations), people in that function get only that set. Everyone else with the designation gets the standard set.</p>':''}
      ${!cur.length?`<div class="note warn">${stdNote||'Nothing is assigned here yet. All KPIs are listed below: tick the ones to assign, set the target and press Save.'}</div>`:''}
      <div class="row" style="justify-content:space-between"><b>${cur.length} KPIs assigned to ${esc((vals(type).find(v=>v[0]===who)||[,''])[1])}${type==='designation'&&fn?' in '+esc(fn):''}</b>
        <div class="row"><label class="f" for="r_kfn" style="width:200px">KPI function<select id="r_kfn"><option value="">All</option>${FUNCTIONS.map(f=>`<option ${f===kfn?'selected':''}>${esc(f)}</option>`).join('')}</select></label><label class="small"><input type="checkbox" id="r_on" ${onlyOn?'checked':''}> Show assigned only</label><label class="f" for="rq" style="width:240px">Search<input id="rq" type="search" value="${esc(filter)}" placeholder="ID, name or category"></label></div></div>
      <div class="scroll"><table><thead><tr><th>Use</th><th>KPI</th><th>Frequency</th><th>Measured as</th><th class="n">Target per period</th>${type==='officer'?'<th>Remove for this officer</th>':''}</tr></thead><tbody id="rRows"></tbody></table></div>
      <div class="row"><button class="btn" type="submit">Save assignment</button><span class="small muted">Weeks already created keep their KPIs. To apply changes to the current week, use Weekly plan → Reset to standard KPIs.</span></div>
    </form>`;
    const state={}; lib.forEach(k=>{ const r=curBy[k.id]; state[k.id]={on:!!r&&!r.excluded, ex:!!r?.excluded, t:r?(r.target??''):'1', m:r?.measure||k.measure}; });
    const rowsHtml=()=>{ const q=filter.toLowerCase();
      $('#rRows').innerHTML=lib.filter(k=>(!onlyOn||state[k.id].on||state[k.id].ex)&&(!kfn||k.function_area===kfn)&&(!q||[k.code,k.name,k.category].join(' ').toLowerCase().includes(q))).map(k=>{ const s=state[k.id];
        return `<tr><td><input type="checkbox" data-k="${k.id}" data-f="on" ${s.on?'checked':''} aria-label="Use ${esc(k.code)}"></td><td><div class="code">${esc(k.code||'')} · ${esc(k.category||'')}</div>${esc(k.name)}</td><td class="small">${esc(k.frequency||PERIODS[k.period])}</td>
        <td><select data-k="${k.id}" data-f="m" aria-label="Measured as"><option value="count" ${s.m!=='percent'?'selected':''}>Count</option><option value="percent" ${s.m==='percent'?'selected':''}>%</option></select></td>
        <td class="n"><input type="number" min="0" step="any" data-k="${k.id}" data-f="t" value="${s.m==='percent'?100:s.t}" placeholder="none" style="width:90px" ${s.m==='percent'?'disabled':''} aria-label="Target"></td>
        ${type==='officer'?`<td><input type="checkbox" data-k="${k.id}" data-f="ex" ${s.ex?'checked':''} aria-label="Remove for this officer"></td>`:''}</tr>`; }).join('')||'<tr><td colspan="6" class="muted">No KPIs match. Untick "Show assigned only" to add KPIs.</td></tr>';
      $('#rRows').querySelectorAll('[data-k]').forEach(el=>el.onchange=el.oninput=()=>{ const s=state[el.dataset.k];
        if(el.dataset.f==='on') s.on=el.checked; if(el.dataset.f==='ex') s.ex=el.checked; if(el.dataset.f==='t') s.t=el.value;
        if(el.dataset.f==='m'){ s.m=el.value; rowsHtml(); } }); };
    rowsHtml();
    $('#rq').oninput=e=>{filter=e.target.value; rowsHtml();};
    $('#r_on').onchange=e=>{onlyOn=e.target.checked; rowsHtml();};
    $('#r_kfn').onchange=e=>{kfn=e.target.value; rowsHtml();};
    $('#r_t').onchange=e=>{type=e.target.value; who=vals(type)[0]?.[0]||''; fn=''; kfn=''; draw();};
    $('#r_v').onchange=e=>{who=e.target.value; if(type==='function') kfn=''; draw();};
    $('#r_fn')&&($('#r_fn').onchange=e=>{fn=e.target.value; draw();});
    $('#rF').onsubmit=async e=>{ e.preventDefault(); if(!who) return toast('Choose who this applies to.');
      const from=ymd(satOf(parse($('#r_f').value||thisWeek()))), endPrev=ymd(addD(parse(from),-1));
      let added=0, removed=0;
      for(const k of lib){ const s=state[k.id], r=curBy[k.id]; const want=s.on||s.ex;
        const t=s.m==='percent'?100:(s.t===''?null:Number(s.t));
        const same=r && !!r.excluded===s.ex && (r.target==null?null:Number(r.target))===t && (r.measure||k.measure)===s.m;
        if(r && (!want || !same)){ const {error}=await sb.from('assignment_rules').update({effective_to:endPrev, active: want}).eq('id',r.id); if(error) return err(error); if(!want) removed++; }
        if(want && !same){ const {error}=await sb.from('assignment_rules').insert({scope_type:type,scope_value:who,scope_function:type==='designation'&&fn?fn:null,kpi_id:k.id,target:t,weight:1,excluded:s.ex,measure:s.m===k.measure?null:s.m,effective_from:from,loc_list:r?.loc_list||null}); if(error) return err(error); added++; } }
      toast(added||removed?`Saved: ${added} added or changed, ${removed} removed.`:'No changes to save.'); draw(); };
  };
  await draw();
}

// ---------- boot ----------
sb.auth.onAuthStateChange((ev, session)=>{
  if(session && !S.me && !S.starting){ S.starting=true; setTimeout(()=>startApp(session).finally(()=>S.starting=false),0); }
  if(!session){ S.me=null; viewLogin(); }
});
sb.auth.getSession().then(({data})=>{ if(!data.session) viewLogin(); });
})();
</script>
